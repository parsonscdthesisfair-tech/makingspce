<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">

<title>Making Space</title>
</head>
<body>

<div class="poster">

  <div class="top-text">
    <div class="line">PARSONS SCHOOL OF DESIGN</div>
    <div class="line">BFA COMMUNICATION DESIGN 2026</div>
    <div class="line">SENIOR THESIS SHOW</div>
  </div>

  <div class="title">
    <div class="making">MAKING</div>
    <div class="space-row">
      <span>SP</span>
      <a href="https://eventbrite.com" target="_blank" class="polygon-btn">
        RSVP
      </a>
      <span class="ce">CE</span>
    </div>
  </div>

  <div class="bottom-text">
    <div class="line">39_WEST 13TH_STREET, 2ND_FLOOR</div>
    <div class="line">FRIDAY, APRIL_17TH, 2026</div>
    <div class="line">10:00_AM – 7:00_PM</div>
  </div>

</div>

<script>
const polygon = document.querySelector(".polygon-btn");

function generateHexagon() {
  const points = 6;
  const centerX = 50;
  const centerY = 50;

  const baseRadius = 42;  
  const radiusVariation = 20; 
  const angleVariation = 0.55;

  let values = [];

  for (let i = 0; i < points; i++) {
    const baseAngle = (Math.PI * 2 / points) * i - Math.PI / 2;

    const angle = baseAngle + (Math.random() - 0.5) * angleVariation;
    const radius = baseRadius + (Math.random() - 0.5) * radiusVariation;

    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle);

    values.push(`${x}% ${y}%`);
  }

  return `polygon(${values.join(",")})`;
}

function changeShape() {
  polygon.style.clipPath = generateHexagon();
}

setInterval(changeShape, 1000);
</script>



</body>
</html>
